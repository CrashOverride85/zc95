<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZC95 Lua Scripts</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1d252c;background:#f6f7f4}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:860px;margin:0 auto;padding:20px}
header{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:24px;margin:0}h2{font-size:16px;margin:0}.meta{font-size:12px;color:#66727c;text-align:right}
.panel{background:#fff;border:1px solid #d7ddd5;border-radius:8px;padding:14px;margin-bottom:12px}
.section-head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:18px 0 8px}
.section-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.select-all{display:flex;gap:6px;align-items:center;font-size:14px;white-space:nowrap}
input[type="checkbox"]{width:18px;height:18px;margin:0;vertical-align:middle;cursor:pointer}input[type="checkbox"]:disabled{cursor:not-allowed}.selection{width:38px}
.bar{display:flex;gap:8px;align-items:center}
.conn{flex:1;font-size:14px;color:#46525c}
button{border:1px solid #9ba9a4;border-radius:6px;background:#eef3ef;color:#172027;padding:8px 11px;font:inherit;cursor:pointer}
button:hover{background:#e1e9e4}button:disabled{opacity:.5;cursor:not-allowed}.danger{background:#fff0ee;border-color:#ca9188}
.status{min-height:22px;font-size:14px;color:#40505a;margin-top:8px}.err{color:#9d2419}.ok{color:#1c6b39}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #d7ddd5;border-radius:8px;overflow:hidden}
th,td{padding:10px;border-bottom:1px solid #e6ebe7;text-align:left}th{font-size:12px;color:#59666f;background:#eef2ee}
tr:last-child td{border-bottom:0}.slot{width:70px}.state{width:90px}.actions{width:170px;text-align:right;white-space:nowrap}
.invalid{color:#9d6a00}.empty{color:#71808a}.progress{height:8px;background:#e5ebe7;border-radius:999px;overflow:hidden;margin-top:6px}
.fill{width:0;height:100%;background:#287a48;transition:width .12s}.hidden{display:none}.small{font-size:12px;color:#66727c}
@media(max-width:640px){.wrap{padding:12px}header{display:block}.meta{text-align:left;margin-top:6px}.section-head{align-items:flex-start;flex-direction:column}.bar{flex-wrap:wrap}.conn{flex-basis:100%}table,tbody,tr,td{display:block}thead{display:none}tr{border-bottom:1px solid #d7ddd5}td{border:0;padding:7px 10px}.actions{text-align:left;width:auto}td[data-label]:before{content:attr(data-label) ": ";font-weight:600}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lua scripts</h1>
    <div class="meta" id="version">Not connected</div>
  </header>

  <section class="panel">
    <div class="bar">
      <div class="conn" id="conn">Disconnected</div>
      <button id="connect">Connect</button>
      <button id="refresh" disabled>Refresh</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <div class="section-head">
    <h2>Script slots</h2>
    <div class="section-tools">
      <label class="select-all"><input id="slots-all" type="checkbox" disabled>Select all</label>
      <button id="slots-delete" class="danger" disabled>Delete selected</button>
    </div>
  </div>
  <table aria-label="Lua script slots">
    <thead><tr><th class="selection" aria-label="Selection"></th><th class="slot">Slot</th><th>Name</th><th class="state">State</th><th class="actions">Actions</th></tr></thead>
    <tbody id="slots"><tr><td colspan="5" class="empty">Connect to load script slots.</td></tr></tbody>
  </table>
  <input id="file" class="hidden" type="file" accept=".lua,text/x-lua,text/plain">

  <div class="section-head">
    <h2>SD card scripts</h2>
    <div class="section-tools">
      <label class="select-all"><input id="sd-all" type="checkbox" disabled>Select all</label>
      <button id="sd-delete" class="danger" disabled>Delete selected</button>
      <button id="sd-upload" disabled>Upload to SD card</button>
    </div>
  </div>
  <table aria-label="SD card Lua scripts">
    <thead><tr><th class="selection" aria-label="Selection"></th><th class="slot">Index</th><th>Name</th><th class="state">State</th><th class="actions">Actions</th></tr></thead>
    <tbody id="sd-scripts"><tr><td colspan="5" class="empty">Connect to load SD card scripts.</td></tr></tbody>
  </table>
  <div class="panel hidden" id="sd-progress">
    <div class="small" id="sd-progress-text"></div>
    <div class="progress"><div class="fill" id="sd-progress-fill"></div></div>
    <div class="small" id="sd-progress-count"></div>
  </div>
  <input id="sd-file" class="hidden" type="file" accept=".lua,text/x-lua,text/plain" multiple>
</div>

<script>
(function(){
  var WS_HOST=null; // For testing, set to e.g. "device.local"; null uses this host.
  var ws=null,msgId=1,pending={},uploading=false,pingTimer=0,selectedSlot=null,closing=false;
  var connectBtn=document.getElementById("connect"),connEl=document.getElementById("conn");
  var refreshBtn=document.getElementById("refresh"),statusEl=document.getElementById("status");
  var slotsEl=document.getElementById("slots"),fileEl=document.getElementById("file"),versionEl=document.getElementById("version");
  var sdEl=document.getElementById("sd-scripts"),sdFileEl=document.getElementById("sd-file"),sdUploadBtn=document.getElementById("sd-upload");
  var sdProgressEl=document.getElementById("sd-progress"),sdProgressText=document.getElementById("sd-progress-text");
  var sdProgressCount=document.getElementById("sd-progress-count"),sdProgressFill=document.getElementById("sd-progress-fill");
  var selectionGroups=[
    {el:slotsEl,all:document.getElementById("slots-all"),deleteBtn:document.getElementById("slots-delete")},
    {el:sdEl,all:document.getElementById("sd-all"),deleteBtn:document.getElementById("sd-delete")}
  ];

  selectionGroups.forEach(function(group){
    group.el.onchange=function(){renderButtons()};
    group.all.onchange=function(){
      if(!connected()||uploading)return;
      group.el.querySelectorAll("input[data-select]").forEach(function(c){c.checked=group.all.checked});
      renderButtons();
    };
    group.deleteBtn.onclick=function(){deleteScripts(selectedIndexes(group))};
  });

  connectBtn.onclick=function(){ws&&ws.readyState===1?disconnect("Disconnected."):connect()};
  refreshBtn.onclick=function(){loadInfo().catch(function(){})};
  fileEl.onchange=function(){var f=fileEl.files[0];fileEl.value="";if(f)upload(selectedSlot,f)};
  sdUploadBtn.onclick=function(){if(!uploading)sdFileEl.click()};
  sdFileEl.onchange=function(){var files=Array.prototype.slice.call(sdFileEl.files||[]);sdFileEl.value="";if(files.length)uploadSdFiles(files)};
  slotsEl.onclick=function(e){
    var b=e.target.closest("button"); if(!b||uploading)return;
    var i=Number(b.getAttribute("data-slot"));
    if(b.getAttribute("data-act")==="upload"){selectedSlot=i;fileEl.click()}
    if(b.getAttribute("data-act")==="delete")deleteScripts([i]);
  };
  sdEl.onclick=function(e){
    var b=e.target.closest("button"); if(!b||uploading)return;
    var i=Number(b.getAttribute("data-slot"));
    if(b.getAttribute("data-act")==="delete")deleteScripts([i]);
  };
  connect();

  function defaultEndpoint(){
    return "ws://"+(WS_HOST||location.host)+"/stream";
  }
  function setStatus(t,cls){statusEl.className="status "+(cls||"");statusEl.textContent=t||""}
  function setConn(t){connEl.textContent=t}
  function connected(){return ws&&ws.readyState===1}
  function setBusy(b){uploading=b;refreshBtn.disabled=!connected()||b;connectBtn.disabled=b;renderButtons()}

  function connect(){
    cleanup();
    closing=false;
    setStatus("Connecting...");
    setConn("Connecting to "+defaultEndpoint());
    try{ws=new WebSocket(defaultEndpoint())}catch(e){setStatus(e.message,"err");setConn("Disconnected");return}
    ws.onopen=function(){
      setConn("Connected to "+defaultEndpoint());
      connectBtn.textContent="Disconnect";refreshBtn.disabled=false;setStatus("Connected.","ok");
      pingTimer=setInterval(function(){if(connected()&&!uploading&&!Object.keys(pending).length)send("GetVersion",null,"VersionDetails").catch(function(){})},6000);
      loadInfo().catch(function(){});
    };
    ws.onmessage=function(ev){handleMessage(ev.data)};
    ws.onerror=function(){setStatus("WebSocket error.","err")};
    ws.onclose=function(){var wasClosing=closing;failPending("Connection lost.");cleanup();setStatus(wasClosing?"Disconnected.":"Connection lost.",wasClosing?"":"err")};
  }
  function disconnect(msg){closing=true;if(ws)ws.close();else{cleanup();setStatus(msg||"Disconnected.")}}
  function cleanup(){
    if(pingTimer)clearInterval(pingTimer); pingTimer=0; ws=null; pending={}; uploading=false;
    setConn("Disconnected");
    connectBtn.textContent="Connect";connectBtn.disabled=false;refreshBtn.disabled=true;renderButtons();
  }
  function failPending(text){
    Object.keys(pending).forEach(function(k){pending[k].reject(new Error(text));clearTimeout(pending[k].timer)});
    pending={};
  }
  function send(type,body,expect){
    if(!connected())return Promise.reject(new Error("Not connected."));
    var id=++msgId,msg=Object.assign({Type:type,MsgId:id},body||{});
    ws.send(JSON.stringify(msg));
    return new Promise(function(resolve,reject){
      pending[id]={expect:expect||"Ack",resolve:resolve,reject:reject,timer:setTimeout(function(){
        delete pending[id]; reject(new Error("Timed out waiting for "+type+"."));
      },8000)};
    });
  }
  function handleMessage(text){
    var msg;
    try{msg=JSON.parse(text)}catch(e){setStatus("Received invalid JSON.","err");return}
    if(msg.MsgId!==undefined&&pending[msg.MsgId]){
      var p=pending[msg.MsgId]; clearTimeout(p.timer); delete pending[msg.MsgId];
      if(msg.Result!=="OK")p.reject(new Error(msg.Error||("Device returned "+(msg.Result||"an error")+".")));
      else if(p.expect&&msg.Type!==p.expect)p.reject(new Error("Expected "+p.expect+", got "+msg.Type+"."));
      else p.resolve(msg);
      return;
    }
    if(msg.Result==="ERROR"||msg.Type==="LuaScriptError")setStatus(msg.Error||msg.Text||"Device reported an error.","err");
  }
  function loadInfo(){
    if(!connected())return Promise.reject(new Error("Not connected."));
    refreshBtn.disabled=true;
    return send("GetVersion",null,"VersionDetails").then(function(v){
      showVersion(v);
      return send("GetLuaScripts",null,"LuaScripts");
    }).then(function(s){renderScripts(s.Scripts||[]);setStatus("Scripts loaded.","ok")})
      .catch(function(e){setStatus(e.message,"err");throw e})
      .then(function(v){refreshBtn.disabled=!connected()||uploading;return v},function(e){refreshBtn.disabled=!connected()||uploading;throw e});
  }
  function showVersion(v){
    versionEl.textContent=(v.ZC95||"Unknown version")+" | Serial "+(v.SerialNo||"unknown");
  }
  function renderScripts(scripts){
    renderSlots(scripts);
    renderSdScripts(scripts);
  }
  function renderSlots(allScripts){
    var byIndex={},scripts=[];
    allScripts.forEach(function(s){if(s.Index>=0&&s.Index<=4)byIndex[s.Index]=s});
    for(var i=0;i<=4;i++)scripts.push(byIndex[i]||{Index:i,Empty:true,Valid:false,Name:"<unknown>",Missing:true});
    slotsEl.innerHTML=scripts.map(function(s){
      var state=s.Missing?"Unknown":(s.Empty?"Empty":(s.Valid?"Valid":"Invalid"));
      var cls=s.Empty?"empty":(s.Valid?"":"invalid");
      return '<tr data-row="'+s.Index+'">'+selectionCell(s,"slot")+'<td class="slot" data-label="Slot">'+esc(s.Index)+'</td><td data-label="Name">'+esc(s.Name||"")+'<div class="small hidden" data-prog="'+s.Index+'"><span></span><div class="progress"><div class="fill"></div></div></div></td><td class="state '+cls+'" data-label="State">'+state+'</td><td class="actions" data-label="Actions"><button data-act="upload" data-slot="'+s.Index+'">Upload</button> <button class="danger" data-act="delete" data-slot="'+s.Index+'">Delete</button></td></tr>';
    }).join("");
    renderButtons();
  }
  function renderSdScripts(allScripts){
    var scripts=allScripts.filter(function(s){return s.Index>=100}).sort(function(a,b){return a.Index-b.Index});
    if(!scripts.length){
      sdEl.innerHTML='<tr><td colspan="5" class="empty">No SD card scripts found.</td></tr>';
      renderButtons();
      return;
    }
    sdEl.innerHTML=scripts.map(function(s){
      var state=s.Empty?"Empty":(s.Valid?"Valid":"Invalid");
      var cls=s.Empty?"empty":(s.Valid?"":"invalid");
      return '<tr data-row="'+s.Index+'">'+selectionCell(s,"SD script")+'<td class="slot" data-label="Index">'+esc(s.Index)+'</td><td data-label="Name">'+esc(s.Name||"")+'</td><td class="state '+cls+'" data-label="State">'+state+'</td><td class="actions" data-label="Actions"><button class="danger" data-act="delete" data-slot="'+s.Index+'">Delete</button></td></tr>';
    }).join("");
    renderButtons();
  }
  function selectionCell(s,label){
    var attrs=s.Empty||s.Missing?' disabled':' data-select="'+s.Index+'"';
    return '<td class="selection"><input type="checkbox" aria-label="'+esc("Select "+label+" "+s.Index+(s.Name?": "+s.Name:""))+'"'+attrs+'></td>';
  }
  function selectedIndexes(group){
    return Array.prototype.filter.call(group.el.querySelectorAll("input[data-select]"),function(c){return c.checked})
      .map(function(c){return Number(c.getAttribute("data-select"))});
  }
  function renderButtons(){
    var dis=!connected()||uploading;
    slotsEl.querySelectorAll("button").forEach(function(b){b.disabled=dis});
    sdEl.querySelectorAll("button").forEach(function(b){b.disabled=dis});
    selectionGroups.forEach(function(group){
      var boxes=group.el.querySelectorAll("input[data-select]"),count=selectedIndexes(group).length;
      boxes.forEach(function(c){c.disabled=dis});
      group.all.disabled=dis||!boxes.length;
      group.all.checked=boxes.length>0&&count===boxes.length;
      group.all.indeterminate=count>0&&count<boxes.length;
      group.deleteBtn.disabled=dis||!count;
      group.deleteBtn.textContent="Delete selected"+(count?" ("+count+")":"");
    });
    sdUploadBtn.disabled=dis;
  }
  function deleteScripts(indexes){
    if(!connected()||uploading||!indexes.length)return;
    var label=indexes.length+" script"+(indexes.length===1?"":"s");
    if(!window.confirm("Are you sure you want to delete "+label+"?"))return;
    setBusy(true);setStatus("Deleting "+label+"...");
    return send("DeleteLuaScripts",{Indexes:indexes},"Ack").then(loadInfo)
      .then(function(){setStatus("Deleted "+label+".","ok")})
      .catch(function(e){setStatus(e.message,"err")})
      .then(function(){setBusy(false)});
  }
  function upload(i,file){
    if(i===null||!connected())return;
    setBusy(true);setStatus("Reading "+file.name+"...");
    uploadFileToIndex(i,file,{slot:i})
      .then(loadInfo)
      .then(function(){setStatus("Uploaded "+file.name+" to slot "+i+".","ok")})
      .catch(function(e){setStatus(e.message,"err")})
      .then(function(){hideProgress(i);setBusy(false)});
  }
  function uploadSdFiles(files){
    if(!connected())return;
    setBusy(true);showSdProgress(files[0],0,null,0,files.length);
    return uploadSdFileAt(files,0)
      .then(loadInfo)
      .then(function(){setStatus("Uploaded "+files.length+" file"+(files.length===1?"":"s")+" to SD card.","ok")})
      .catch(function(e){setStatus(e.message,"err");return loadInfo().catch(function(){}).then(function(){setStatus(e.message,"err")});})
      .then(function(){hideSdProgress();setBusy(false)});
  }
  function uploadSdFileAt(files,index){
    if(index>=files.length)return Promise.resolve();
    var file=files[index];
    setStatus("Reading "+file.name+"...");
    showSdProgress(file,0,null,index,files.length);
    return uploadFileToIndex(-1,file,{sd:true,fileIndex:index,totalFiles:files.length})
      .then(function(){return uploadSdFileAt(files,index+1)});
  }
  function uploadFileToIndex(index,file,progressTarget){
    return readText(file).then(function(text){
      var lines=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");
      if(lines.length&&lines[lines.length-1]==="")lines.pop();
      return send("LuaStart",{Index:index},"Ack").then(function(){return sendLines(progressTarget,lines,0)});
    }).then(function(){return send("LuaEnd",null,"Ack")});
  }
  function sendLines(target,lines,n){
    progress(target,n,lines.length);
    if(n>=lines.length)return Promise.resolve();
    return send("LuaLine",{LineNumber:n,Text:lines[n]},"Ack").then(function(){return sendLines(target,lines,n+1)});
  }
  function progress(target,done,total){
    if(target&&target.sd){showSdProgress(null,done,total,target.fileIndex,target.totalFiles);return}
    var slot=target&&target.slot;
    var box=slotsEl.querySelector('[data-prog="'+slot+'"]'); if(!box)return;
    var pct=total?Math.round(done*100/total):100;
    box.classList.remove("hidden"); box.querySelector("span").textContent="Uploading "+pct+"%";
    box.querySelector(".fill").style.width=pct+"%";
  }
  function hideProgress(slot){var box=slotsEl.querySelector('[data-prog="'+slot+'"]');if(box)box.classList.add("hidden")}
  function showSdProgress(file,done,total,fileIndex,totalFiles){
    var pct=total===0?100:(total?Math.round(done*100/total):0);
    var left=Math.max(totalFiles-fileIndex-1,0);
    sdProgressEl.classList.remove("hidden");
    if(file)sdProgressEl.setAttribute("data-file",file.name);
    sdProgressText.textContent="Uploading "+(sdProgressEl.getAttribute("data-file")||"file")+" - "+pct+"%";
    sdProgressCount.textContent="File "+(fileIndex+1)+" of "+totalFiles+"; "+left+" left";
    sdProgressFill.style.width=pct+"%";
  }
  function hideSdProgress(){
    sdProgressEl.classList.add("hidden");
    sdProgressEl.removeAttribute("data-file");
    sdProgressFill.style.width="0";
  }
  function readText(file){
    return new Promise(function(resolve,reject){
      var r=new FileReader(); r.onload=function(){resolve(String(r.result||""))}; r.onerror=function(){reject(new Error("Could not read file."))}; r.readAsText(file);
    });
  }
  function esc(v){return String(v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
})();
</script>
</body>
</html>
